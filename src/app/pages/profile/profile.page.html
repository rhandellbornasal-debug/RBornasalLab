<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Profile</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <div class="profile-container" *ngIf="student">

    <ion-avatar>
      <img
        [src]="student.image"
        alt="Student profile"
      >
    </ion-avatar>

    <ion-list>

      <ion-item>
        <ion-label>
          <strong>Name</strong>
          <p>{{ student.name }}</p>
        </ion-label>
      </ion-item>

      <ion-item>
        <ion-label>
          <strong>Username</strong>
          <p>{{ student.username }}</p>
        </ion-label>
      </ion-item>

      <ion-item>
        <ion-label>
          <strong>Email</strong>
          <p>{{ student.email }}</p>
        </ion-label>
      </ion-item>

      <ion-item>
        <ion-label>
          <strong>Address</strong>
          <p>{{ student.address }}</p>
        </ion-label>
      </ion-item>

    </ion-list>

  </div>

</ion-content>
