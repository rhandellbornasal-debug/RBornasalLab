<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Catalog</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-grid>
    <ion-row>

      <ion-col size="6" *ngFor="let product of products">

        <ion-card
          button
          [routerLink]="['/tabs/product-page', product.id]"
        >
          <img
            [src]="product.image"
            [alt]="product.name"
          >

          <ion-card-header>
            <ion-card-title>
              {{ product.name }}
            </ion-card-title>

            <ion-card-subtitle>
              ₱{{ product.price }}
            </ion-card-subtitle>
          </ion-card-header>
        </ion-card>

      </ion-col>

    </ion-row>
  </ion-grid>

</ion-content>
